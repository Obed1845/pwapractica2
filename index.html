<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes - Práctica 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        
        .carousel-container {
            position: relative;
            max-width: 800px;
            width: 90%;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background-color: #fff;
        }
        .carousel-slide {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-slide img {
            width: 100%;
            flex-shrink: 0;
            object-fit: cover;
        }
        
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
            z-index: 10;
        }
        .btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }
    </style>
</head>
<body>

    <div class="carousel-container">
        <button class="btn btn-prev" id="prevBtn">&#10094; Anterior</button>
        
        <div class="carousel-slide" id="slide">
            <img src="https://cdn.motor1.com/images/mgl/Zqvqy/s1/4x3/apollo-intensa-emozione.webp" alt="Imagen 1">
            <img src="https://d1gl66oyi6i593.cloudfront.net/wp-content/uploads/2022/01/superdeportivos-baratos-9.jpg" alt="Imagen 2">
            <img src="https://www.elcarrocolombiano.com/wp-content/uploads/2026/10/20261016-PORSCHE-MISSION-S-CONCEPT-2026-01.jpg" alt="Imagen 3">
        </div>

        <button class="btn btn-next" id="nextBtn">Siguiente &#10095;</button>
    </div>

    <script>
        const slide = document.getElementById('slide');
        const images = document.querySelectorAll('.carousel-slide img');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let counter = 0;

        function updateSlide() {
            const currentSize = images[0].clientWidth;
            slide.style.transform = 'translateX(' + (-currentSize * counter) + 'px)';
        }

        nextBtn.addEventListener('click', () => {
            if (counter >= images.length - 1) {
                counter = 0; 
            } else {
                counter++;
            }
            updateSlide();
        });

        prevBtn.addEventListener('click', () => {
            if (counter <= 0) {
                
                counter = images.length - 1;
            } else {
                counter--;
            }
            updateSlide();
        });

        window.addEventListener('resize', updateSlide);
    </script>
</body>
</html>
